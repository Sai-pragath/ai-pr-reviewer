global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Spring Boot Backend Custom Actuator metrics
  - job_name: 'spring-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  # Scrape cAdvisor container performance metrics
  - job_name: 'cadvisor'
    metrics_path: '/cadvisor/metrics'
    static_configs:
      - targets: ['cadvisor:8080']
