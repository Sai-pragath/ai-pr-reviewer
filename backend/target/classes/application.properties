# Application Port Configuration
server.port=8080

# PostgreSQL Database Integration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aipr_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Mapping Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# LLM Providers Configuration
# Available settings: stub, claude, gemini
llm.provider=${LLM_PROVIDER:stub}
llm.claude.api-key=${CLAUDE_API_KEY:}
llm.claude.model=claude-3-5-sonnet-20241022
llm.gemini.api-key=${GEMINI_API_KEY:}
llm.gemini.model=gemini-1.5-pro
llm.default-system-prompt=You are a senior software engineering staff reviewer. Analyze the pull request diff code chunk. Perform checks for security flaws, buffer issues, SQL injection, logical errors, resource leaks, and performance optimization. Output comment responses in standard JSON format containing file, line, and comments.

# Monitoring & Observability Actuator Endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Thread Pool Settings for Async Webhook Review Service
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=15
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=review-task-
